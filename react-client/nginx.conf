server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any path that isn't a real
    # static file (e.g. /room/ABC123 on a hard refresh) must fall back to
    # index.html and let the SPA's router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
