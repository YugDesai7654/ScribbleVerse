name: Deploy Backend to GCP VM

on:
  push:
    branches:
      - gcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH into GCP VM and deploy backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          script: |
            # --- Environment Setup ---
            # Source NVM to make node and npm available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # --- Deployment Steps ---
            # Navigate to the project directory
            cd ~/scribbleverse

            echo "📥 Pulling latest code from gcp branch..."
            git pull origin gcp

            # Navigate to the backend server directory
            cd socket-server

            echo "📦 Installing backend dependencies..."
            npm install

            echo "🏗️ Building the TypeScript code..."
            npm run build

            echo "🚀 Restarting the backend server with PM2..."
            pm2 restart scribbleverse-backend

            echo "✅ Backend deployment complete!"
