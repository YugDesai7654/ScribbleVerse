services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  socket-server:
    build:
      context: ./socket-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://mongo:27017/scribbleverse
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  react-client:
    build:
      context: ./react-client
      args:
        VITE_SOCKET_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      socket-server:
        condition: service_healthy

volumes:
  mongo-data:
